name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download the Gradle distribution
        # The wrapper does not retry, so one slow services.gradle.org response used to fail the
        # whole run. Only this download is retried; build and test failures are never retried.
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            [ "$attempt" -lt 4 ] || break
            echo "::warning::Gradle distribution download failed (attempt $attempt of 4); retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Run unit tests, KRC integration tests, and build
        run: |
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew --no-daemon test runGameTestServer build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krc-rider-power
          path: build/libs/*.jar
          if-no-files-found: error
